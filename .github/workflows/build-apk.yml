name: Build Android APK (MedBrief Daily)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm "Run workflow" thủ công bất cứ lúc nào trên GitHub

jobs:
  build-apk:
    name: Build & Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Thiết lập Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 4. Đồng bộ Web Assets mới nhất vào Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css app.js manifest.json sw.js icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: 5. Biên dịch Android APK (Debug & Self-Signed Release)
        working-directory: ./android
        run: |
          # Biên dịch APK Debug (Cài trực tiếp lên mọi điện thoại Android)
          gradle assembleDebug --stacktrace
          
          # Đổi tên file để tải về rõ ràng
          mkdir -p ../output-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../output-apk/MedBrief-Endocrinology-v1.0.apk
          
          echo "Biên dịch APK thành công!"
          ls -lh ../output-apk/

      - name: 6. Xuất bản Tệp APK (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MedBrief-Endocrinology-Android-APK
          path: output-apk/MedBrief-Endocrinology-v1.0.apk
          retention-days: 30

      - name: 7. Tạo GitHub Release để tải trực tiếp trên điện thoại
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/MedBrief-Endocrinology-v1.0.apk
          tag_name: v1.0.0
          name: MedBrief Daily v1.0.0 (Android APK)
          body: |
            ## 📱 Bản cài đặt MedBrief Daily cho Android (APK)
            - **Chuyên ngành**: Nội tiết - Chuyển hóa & Đái tháo đường
            - **Tính năng**: Curation tự động 8 tạp chí lớn, Song ngữ Anh-Việt, Medical English Masterclass, Contextual AI Chat, Offline Support.
            
            ### Cách cài đặt:
            1. Tải tệp `MedBrief-Endocrinology-v1.0.apk` bên dưới về điện thoại Android.
            2. Mở tệp vừa tải và chọn **"Cài đặt"** (Install).
            3. Nếu điện thoại hỏi *"Cho phép cài đặt từ nguồn này"*, hãy chọn **Đồng ý**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
