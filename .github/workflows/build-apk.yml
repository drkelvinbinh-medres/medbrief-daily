name: Build Android APK (MedBrief Daily)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Tự động chấp nhận Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. Thiết lập Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: 5. Đồng bộ Web Assets vào thư mục Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css app.js manifest.json sw.js icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: 6. Biên dịch Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          
          mkdir -p ../output-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../output-apk/MedBrief-Endocrinology-v1.0.apk
          echo "Biên dịch APK thành công!"
          ls -lh ../output-apk/

      - name: 7. Tải lên Tệp APK (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MedBrief-Endocrinology-Android-APK
          path: output-apk/MedBrief-Endocrinology-v1.0.apk
          retention-days: 30

      - name: 8. Tạo GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/MedBrief-Endocrinology-v1.0.apk
          tag_name: v1.0.0
          name: MedBrief Daily v1.0.0 (Android APK)
          body: |
            ## 📱 Bản cài đặt MedBrief Daily cho Android (APK)
            Tải tệp `MedBrief-Endocrinology-v1.0.apk` bên dưới về máy và bấm cài đặt.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
